name: Deploy — All Services

on:
  workflow_dispatch:
    inputs:
      deploy_client:
        description: 'traveller-client → Vercel'
        type: boolean
        default: true
      deploy_admin:
        description: 'traveller-admin → Vercel'
        type: boolean
        default: true
      deploy_wondrr:
        description: 'wondrr-host-client → Vercel'
        type: boolean
        default: true
      deploy_server:
        description: 'traveller-server → EC2'
        type: boolean
        default: true

jobs:
  deploy-client:
    name: traveller-client → Vercel
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.deploy_client }}
    steps:
      - name: Trigger Vercel deploy
        run: |
          response=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_CLIENT }}")
          echo "$response"

  deploy-admin:
    name: traveller-admin → Vercel
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.deploy_admin }}
    steps:
      - name: Trigger Vercel deploy
        run: |
          response=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}")
          echo "$response"

  deploy-wondrr:
    name: wondrr-host-client → Vercel
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.deploy_wondrr }}
    steps:
      - name: Trigger Vercel deploy
        run: |
          response=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_WONDRR }}")
          echo "$response"

  deploy-server:
    name: traveller-server → EC2
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.deploy_server }}
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            source ~/.nvm/nvm.sh
            source ~/.bashrc
            cd wondrr-backend
            echo "--- pulling latest ---"
            git pull origin production
            echo "--- installing deps ---"
            npm install
            echo "--- running migrations ---"
            npm run migrate:up
            echo "--- restarting pm2 ---"
            /home/ubuntu/.nvm/versions/node/v22.16.0/bin/pm2 stop all
            /home/ubuntu/.nvm/versions/node/v22.16.0/bin/pm2 start all
            /home/ubuntu/.nvm/versions/node/v22.16.0/bin/pm2 save
            echo "--- done ---"
